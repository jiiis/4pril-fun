<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>4pril.fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="4pril.fun" />
  <meta name="theme-color" content="#0f1115" />
</head>
<body>
  <div id="wrap">

    <canvas id="c" width="1440" height="840"></canvas>

    <div id="menu"></div>

  </div>

    <header id="hud">
      <div class="hud-left">
        <div class="stat gold"><span class="icon" data-icon="coins"></span><b id="gold">0</b></div>
        <div class="stat lives"><span class="icon" data-icon="heart"></span><b id="lives">0</b></div>
        <div class="stat wave"><span class="icon" data-icon="swords"></span><b id="wave">0</b><span class="dim">/<span id="totalWaves">0</span></span></div>
      </div>
      <div class="hud-topright">
        <div class="stat seed"><span class="icon" data-icon="map"></span><span class="dim">#<span id="seed">0</span></span></div>
      </div>
      <div class="hud-logo"><img src="icon-192.png" alt="Yun Guard" /><span class="brand">4pril<em>.fun</em></span></div>
      <div class="hud-right">
        <button id="mute" class="round" title="Sound on/off" data-icon="volume"></button>
        <button id="restart-level" class="round" title="Restart this map (R)" data-icon="restart"></button>
        <button id="fullscreen" class="round" title="Full screen (F)" data-icon="expand"></button>
        <button id="pause" class="round" title="Pause (P)" data-icon="pause"></button>
        <button id="next" class="round big" title="Next wave"><span class="face" data-icon="play"></span><span class="badge" id="nextBadge"></span></button>
      </div>
    </header>

    <div id="paused"><span data-icon="play" title="Resume"></span><small>paused · tap or press P to resume</small></div>

    <div id="overlay">
      <h1 id="overlayTitle"></h1>
      <p id="overlayText"></p>
      <button id="restart">Play again</button>
    </div>

    <div id="heroPick">
      <p class="eyebrow">Yun Guard</p>
      <h1>Choose your legend</h1>
      <div class="cards">
        <button class="card" data-hero="april">
          <span class="portrait" data-icon="sword"></span>
          <strong>Lady April</strong>
          <em>Knight</em>
          <small>Sword and shield, tough as nails. Her dog Max fights at her side.</small>
        </button>
        <button class="card" data-hero="avril">
          <span class="portrait" data-icon="bow"></span>
          <strong>Princess Avril</strong>
          <em>Archer</em>
          <small>Frost arrows slow monsters, and she heals friends nearby. Her eagle Sky dives from above.</small>
        </button>
        <button class="card" data-hero="ember">
          <span class="portrait" data-icon="flame"></span>
          <strong>Ember</strong>
          <em>Fire mage</em>
          <small>Fragile, but her fireballs splash and set monsters ablaze. Her baby dragon Cinder spits fire from the sky.</small>
        </button>
        <button class="card" data-hero="willow">
          <span class="portrait" data-icon="leaf"></span>
          <strong>Willow</strong>
          <em>Druid</em>
          <small>Every few seconds her vines root every monster near her. Her bear Bramble holds the line.</small>
        </button>
        <button class="card" data-hero="meilin">
          <span class="portrait" data-icon="snowflake"></span>
          <strong>寒 Hán</strong>
          <em>Warrior</em>
          <small>Cool as winter: her sword cleaves through several monsters at once. Her loong Yun 云 sweeps down the road.</small>
        </button>
      </div>
      <button id="noLegend" class="ghost"><span data-icon="shieldOff"></span>Go without a legend <kbd>N</kbd></button>
    </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
