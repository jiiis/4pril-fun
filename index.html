<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>4pril.fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Cinzel:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="yun-guard/css/style.css" />
  <link rel="manifest" href="yun-guard/manifest.webmanifest" vite-ignore />
  <link rel="apple-touch-icon" href="yun-guard/icon-180.png" />
  <link rel="icon" href="yun-guard/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="4pril.fun" />
  <meta name="theme-color" content="#0f1115" />
</head>
<body class="home">
  <div id="wrap">

    <canvas id="c" width="1440" height="840"></canvas>

  </div>
  <div id="menu"></div>

    <header id="hud">
      <div class="hud-left">
        <div class="stat level"><span class="icon" data-icon="flag"></span><b><span data-i18n="Lv">Lv</span> <span id="lvl">1</span></b></div>
        <div class="stat gold"><span class="icon" data-icon="coins"></span><b id="gold">0</b></div>
        <div class="stat lives"><span class="icon" data-icon="heart"></span><b id="lives">0</b></div>
        <div class="stat wave"><span class="icon" data-icon="swords"></span><b id="wave">0</b><span class="dim"><span class="wave-divider">/</span><span id="totalWaves">0</span></span></div>
      </div>
      <div class="hud-topright">
        <div class="languagePicker" role="group" aria-label="Language" data-i18n-aria-label="Language">
          <button type="button" data-language="en-US" lang="en-US" aria-label="English (US)" data-i18n-aria-label="English (US)" aria-pressed="true">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-language="zh-CN" lang="zh-CN" aria-label="Simplified Chinese" data-i18n-aria-label="Simplified Chinese" aria-pressed="false">中</button>
        </div>
        <button id="settings-toggle" class="settingsIcon" type="button" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false" data-icon="settings" data-i18n-title="Settings" data-i18n-aria-label="Settings"></button>
        <a class="stat seed" id="seedLink" href="#" title="Click to put this map in the address bar and copy the link" data-i18n-title="Click to put this map in the address bar and copy the link"><span class="icon" data-icon="map"></span><span class="dim">#<span id="seed">0</span></span></a>
      </div>
      <div class="hud-logo"><img src="yun-guard/icon-192.png" alt="Yun Guard"/><span class="words"><span class="brand">4pril<em>.fun</em></span><span class="title">Yun Guard</span></span></div>
      <div class="hud-right">
        <button id="legendBadge" type="button" title="Find your legend" aria-label="Find your legend" aria-pressed="false" data-i18n-title="Find your legend" data-i18n-aria-label="Find your legend"></button>
        <button id="mute" class="round" title="Sound on/off" data-icon="volume" data-i18n-title="Sound on/off" data-shortcut="M"></button>
        <button id="fullscreen" class="round" title="Full screen" data-icon="expand" data-i18n-title="Full screen" data-shortcut="F"></button>
        <button id="restart-level" class="round" title="New map, same level" data-icon="restart" data-i18n-title="New map, same level" data-shortcut="R"></button>
        <button id="pause" class="round" title="Pause" data-icon="pause" data-i18n-title="Pause" data-shortcut="P"></button>
        <button id="next" class="round big" title="Next wave" data-i18n-title="Next wave" data-shortcut="N"><span class="face" data-icon="play"></span><span class="badge" id="nextBadge"></span></button>
      </div>
    </header>

    <div id="paused" class="game-overlay">
      <button id="resume" class="overlay-choice" type="button" title="Resume" aria-label="Resume" data-i18n-title="Resume" data-i18n-aria-label="Resume">
        <span class="overlay-choice-icon" data-icon="play"></span>
        <small class="overlay-button-label"><span data-i18n="RESUME">RESUME</span></small>
      </button>
      <small class="overlay-caption"><span data-i18n="paused · tap to resume" data-shortcut-text="paused · tap or press P to resume">paused · tap to resume</span></small>
    </div>

    <div id="confirm" class="game-overlay">
      <div class="overlay-actions">
        <button id="confirmSame" class="overlay-choice"><span class="overlay-choice-icon" data-icon="restart"></span><small class="overlay-button-label"><span data-i18n="same map">same map</span></small></button>
        <button id="confirmNew" class="overlay-choice alt"><span class="overlay-choice-icon" data-icon="map"></span><small class="overlay-button-label"><span data-i18n="new map">new map</span></small></button>
      </div>
      <small class="overlay-caption"><span data-i18n="restart level">restart level</span> <span id="confirmLevel">1</span> <span data-i18n="· tap outside to cancel" data-shortcut-text="· tap outside or press Esc to cancel">· tap outside to cancel</span></small>
    </div>

    <div id="overlay" class="game-overlay">
      <h1 id="overlayTitle"></h1>
      <p id="overlayText"></p>
      <div class="overlay-actions">
        <button id="restart"><span data-i18n="Play again">Play again</span></button>
        <button id="changeLegend" class="ghost" style="display:none"><span data-i18n="Change legend">Change legend</span></button>
      </div>
    </div>

    <div id="rotate"><span data-icon="restart"></span><span data-i18n="Turn your phone sideways for the best view">Turn your phone sideways for the best view</span></div>

    <div id="heroPick">
      <div class="levelPick">
        <button id="lvPrev" title="Previous level" data-icon="chevronLeft" data-i18n-title="Previous level"></button>
        <span class="levelField"><span id="lvLabel"><span data-i18n="Level">Level</span></span> <input id="lvInput" aria-labelledby="lvLabel" type="number" min="1" max="100" value="1" /></span>
        <button id="lvNext" title="Next level" data-icon="chevronRight" data-i18n-title="Next level"></button>
        <button id="resetProgress" class="ghost reset" title="Forget the saved level and carried gold, and start from level 1" data-i18n-title="Forget the saved level and carried gold, and start from level 1"><span data-icon="eraser"></span><span class="lbl"><span data-i18n="Reset progress">Reset progress</span></span></button>
      </div>
      <h1><span data-i18n="Choose your legend">Choose your legend</span></h1>
      <div class="cards">
        <button class="card" data-hero="april">
          <kbd>1</kbd>
          <span class="portrait" data-icon="sword"></span>
          <strong><span data-i18n="April">April</span></strong>
          <em><span data-i18n="Knight">Knight</span></em>
          <small><span data-i18n="Sword and shield, tough as nails. Her dog Max fights at her side.">Sword and shield, tough as nails. Her dog Max fights at her side.</span></small>
        </button>
        <button class="card" data-hero="avril">
          <kbd>2</kbd>
          <span class="portrait" data-icon="bow"></span>
          <strong><span data-i18n="Avril">Avril</span></strong>
          <em><span data-i18n="Archer">Archer</span></em>
          <small><span data-i18n="Frost arrows slow monsters, and she heals friends nearby. Her eagle Sky dives from above.">Frost arrows slow monsters, and she heals friends nearby. Her eagle Sky dives from above.</span></small>
        </button>
        <button class="card" data-hero="adrien">
          <kbd>3</kbd>
          <span class="portrait" data-icon="shieldCheck"></span>
          <strong><span data-i18n="Adrien">Adrien</span></strong>
          <em><span data-i18n="Paladin">Paladin</span></em>
          <small><span data-i18n="A gallant knight in white and gold. His lance charge pierces and stuns enemies, while his lion Leon fights beside him.">A gallant knight in white and gold. His lance charge pierces and stuns enemies, while his lion Leon fights beside him.</span></small>
        </button>
        <button class="card" data-hero="ember">
          <kbd>4</kbd>
          <span class="portrait" data-icon="flame"></span>
          <strong><span data-i18n="Candice">Candice</span></strong>
          <em><span data-i18n="Fire mage">Fire mage</span></em>
          <small><span data-i18n="Fragile, but her fireballs splash and set monsters ablaze. Her baby dragon Cinder spits fire from the sky.">Fragile, but her fireballs splash and set monsters ablaze. Her baby dragon Cinder spits fire from the sky.</span></small>
        </button>
        <button class="card" data-hero="willow">
          <kbd>5</kbd>
          <span class="portrait" data-icon="leaf"></span>
          <strong><span data-i18n="Willow">Willow</span></strong>
          <em><span data-i18n="Druid">Druid</span></em>
          <small><span data-i18n="Every few seconds her vines root every monster near her. Her bear Bramble holds the line.">Every few seconds her vines root every monster near her. Her bear Bramble holds the line.</span></small>
        </button>
        <button class="card" data-hero="meilin">
          <kbd>6</kbd>
          <span class="portrait" data-icon="snowflake"></span>
          <strong><span data-i18n="寒 Hán">寒 Hán</span></strong>
          <em><span data-i18n="Warrior">Warrior</span></em>
          <small><span data-i18n="Cool as winter: her sword cleaves through several monsters at once. Her loong Yun 云 sweeps down the road.">Cool as winter: her sword cleaves through several monsters at once. Her loong Yun 云 sweeps down the road.</span></small>
        </button>
      </div>
      <button id="noLegend" class="ghost"><span data-icon="shieldOff"></span><span data-i18n="Go without a legend">Go without a legend</span> <kbd>W</kbd></button>
    </div>

    <dialog id="settings" class="game-overlay" aria-labelledby="settingsTitle">
      <button id="settings-close" class="settingsIcon" type="button" title="Close" aria-label="Close" data-icon="x" data-i18n-title="Close" data-shortcut="Esc" data-i18n-aria-label="Close"></button>
      <div class="settings-content">
        <h1 id="settingsTitle" data-i18n="Settings">Settings</h1>
        <h2 id="towerControlsTitle" data-i18n="Tower menu style">Tower menu style</h2>
        <div class="menuStylePicker" role="group" aria-labelledby="towerControlsTitle">
          <div class="menuStyleOptions">
            <button type="button" data-menu-style="inspector" aria-pressed="true" title="Side panel on desktop; bottom sheet on portrait phones" data-i18n-title="Side panel on desktop; bottom sheet on portrait phones"><span data-icon="panel"></span><span data-i18n="Inspector">Inspector</span></button>
            <button type="button" data-menu-style="floating" aria-pressed="false" title="A floating panel beside the selected tower" data-i18n-title="A floating panel beside the selected tower"><span data-icon="floating"></span><span data-i18n="Floating">Floating</span></button>
            <button type="button" data-menu-style="radial" aria-pressed="false" title="Quick actions around the tower; open Details for stats and skills" data-i18n-title="Quick actions around the tower; open Details for stats and skills"><span data-icon="radial"></span><span data-i18n="Radial">Radial</span></button>
          </div>
        </div>
      </div>
    </dialog>

  <script type="module" src="yun-guard/js/main.js"></script>
</body>
</html>
